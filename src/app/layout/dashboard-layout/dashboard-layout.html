<div class="h-screen flex bg-gray-50 overflow-hidden">

  <div class="w-64 bg-blue-900 text-white flex flex-col hidden md:flex">
    <div class="p-6 text-2xl font-bold border-b border-blue-800">
      SaaS Invoicing
    </div>
    <nav class="flex-1 p-4 space-y-2">
      <a *ngFor="let item of navigation"
         [routerLink]="item.href"
         routerLinkActive="bg-blue-800"
         class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-blue-800 transition">
        <span>{{ item.icon }}</span>
        {{ item.name }}
      </a>
    </nav>

    <div class="p-4 border-t border-blue-800">
      <button (click)="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition font-medium shadow-sm">
        🚪 Wyloguj się
      </button>
    </div>
  </div>

  <div class="flex-1 flex flex-col overflow-hidden">
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
